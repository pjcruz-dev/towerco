; Align with DocExtract (50 MB/file) and multi-file batches; nginx client_max_body_size must match.
upload_max_filesize = 64M
post_max_size = 512M
; Default PHP max_file_uploads is 20 — DocExtract allows up to 150 files per batch.
max_file_uploads = 200
; Large PDF consolidate/extract holds upload + storage reads in memory.
memory_limit = 512M
