; INFRA SUITE PHP OPcache tuning (dev + prod baseline).
; In dev the source is bind-mounted, so timestamps are validated (revalidate_freq).
; For production images set opcache.validate_timestamps=0 to skip filesystem stat calls.
opcache.enable=1
; php artisan serve is the CLI SAPI. Without this, every request recompiles
; the framework from the Windows bind mount (~13s per request).
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Windows Docker bind mounts flap file mtimes, so timestamp checks recompile
; the whole app on every request. PHP edits need an API container restart.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.jit=1255
opcache.jit_buffer_size=64M
